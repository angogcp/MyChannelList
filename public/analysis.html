<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Analysis Dashboard - Video DL</title>
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://unpkg.com/feather-icons"></script>
  <style>
    /* ── Stat cards row ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 14px;
      margin-bottom: 28px;
    }
    .stat-card {
      padding: 20px 18px 16px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 18px 13px 17px 12px;
      position: relative;
      overflow: hidden;
      transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1),
                  box-shadow 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .stat-card::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent-primary-bright), var(--accent-secondary-bright));
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .stat-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 36px rgba(92, 117, 74, 0.14), 0 4px 12px rgba(92, 117, 74, 0.06);
    }
    .stat-card:hover::after {
      opacity: 1;
    }
    .stat-card .stat-value {
      font-size: 1.85rem;
      font-weight: 800;
      color: var(--ink-deep);
      line-height: 1.05;
      letter-spacing: -0.035em;
      font-family: var(--font-display);
    }
    .stat-card .stat-label {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .stat-card .stat-sub {
      font-size: 0.72rem;
      color: var(--text-faint);
      margin-top: 3px;
    }

    /* ── Section styling ── */
    .dash-section {
      margin-bottom: 28px;
    }
    .dash-section-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .dash-section-header i {
      color: var(--accent-cool);
      width: 18px;
      height: 18px;
    }
    .dash-section-header h2 {
      font-family: 'Newsreader', serif;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--ink-green);
    }
    .dash-section-header .badge {
      margin-left: auto;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: var(--bg-surface);
      padding: 3px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
    }

    /* ── Channel performance table ── */
    .ch-table {
      width: 100%;
      border-collapse: collapse;
    }
    .ch-table th {
      text-align: left;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-faint);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 8px 14px;
      border-bottom: 1px solid var(--border);
    }
    .ch-table td {
      padding: 11px 14px;
      font-size: 0.88rem;
      color: var(--text-main);
      border-bottom: 1px solid var(--border);
    }
    .ch-table tr:last-child td { border-bottom: none; }
    .ch-table .ch-name { font-weight: 600; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ch-table .ch-count { color: var(--text-muted); text-align: center; }
    .ch-table .ch-rate { text-align: right; }
    .bar-track {
      display: inline-block;
      width: 80px;
      height: 6px;
      background: rgba(0,0,0,0.06);
      border-radius: 99px;
      overflow: hidden;
      vertical-align: middle;
      margin-right: 8px;
    }
    .bar-fill {
      height: 100%;
      border-radius: 99px;
      background: var(--gradient-btn);
      transition: width 0.4s ease;
    }
    .bar-fill.low { background: linear-gradient(90deg, #c86a82, #d86f8f); }
    .bar-fill.mid { background: linear-gradient(90deg, #e6aa3d, #f8cf70); }

    /* ── Needs attention cards ── */
    .attention-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 16px 11px 15px 12px;
      margin-bottom: 8px;
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }
    .attention-card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 8px;
      bottom: 8px;
      width: 2.5px;
      background: var(--accent-primary-bright);
      border-radius: 0 3px 3px 0;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .attention-card:hover {
      border-color: rgba(125, 167, 106, 0.3);
      box-shadow: 0 8px 24px rgba(92, 117, 74, 0.1);
      transform: translateX(3px);
    }
    .attention-card:hover::before {
      opacity: 1;
    }
    .attention-card .at-title {
      flex: 1;
      min-width: 0;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-main);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .attention-card .at-channel {
      font-size: 0.78rem;
      color: var(--text-muted);
      white-space: nowrap;
    }

    /* ── Activity timeline ── */
    .activity-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      font-size: 0.88rem;
      transition: background 0.15s ease;
    }
    .activity-item:last-child { border-bottom: none; }
    .activity-item:hover {
      background: rgba(255, 253, 242, 0.4);
    }
    .act-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 0 3px rgba(61, 143, 92, 0.1);
    }
    .act-dot.downloaded { background: var(--accent-secondary-bright); box-shadow: 0 0 0 3px rgba(90, 184, 122, 0.12); }
    .act-dot.skipped { background: var(--accent-berry); box-shadow: 0 0 0 3px rgba(191, 94, 120, 0.12); }
    .act-dot.completed { background: var(--accent-primary-bright); box-shadow: 0 0 0 3px rgba(240, 184, 64, 0.12); }
    .act-title {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text-main);
    }
    .act-channel {
      color: var(--text-muted);
      font-size: 0.82rem;
      white-space: nowrap;
    }
    .act-time {
      color: var(--text-faint);
      font-size: 0.78rem;
      white-space: nowrap;
    }

    /* ── Empty state ── */
    .dash-empty {
      text-align: center;
      color: var(--text-muted);
      padding: 40px 20px;
      font-size: 0.9rem;
      line-height: 1.6;
    }
    .dash-empty i {
      display: block;
      margin: 0 auto 12px;
      width: 32px;
      height: 32px;
      opacity: 0.4;
    }

    /* ── AI status card ── */
    .ai-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 20px 22px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 18px 13px 17px 12px;
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .ai-card:hover {
      border-color: rgba(125, 167, 106, 0.2);
      box-shadow: 0 6px 20px rgba(92, 117, 74, 0.06);
    }
    .ai-card .ai-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .ai-card .ai-icon.on { background: rgba(90, 184, 122, 0.15); color: var(--success); box-shadow: 0 0 0 4px rgba(90, 184, 122, 0.08); }
    .ai-card .ai-icon.off { background: rgba(191, 94, 120, 0.1); color: var(--text-muted); }
    .ai-card .ai-body { flex: 1; min-width: 0; }
    .ai-card .ai-status {
      font-size: 0.88rem;
      color: var(--text-main);
      font-weight: 600;
    }
    .ai-card .ai-detail {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .ai-card .ai-action { flex-shrink: 0; }

    .overdue { color: var(--warning) !important; }
    .meta-muted { color: var(--text-faint); font-size: 0.78rem; }

    /* ── Garbled data indicator ── */
    .garbled-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--accent-berry);
      border: 1px solid rgba(200, 106, 130, 0.25);
      background: rgba(200, 106, 130, 0.08);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .garbled-title {
      color: var(--text-faint);
      font-style: italic;
    }

    /* ── Action buttons ── */
    .action-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--bg-surface);
      color: var(--text-muted);
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      white-space: nowrap;
      line-height: 1.4;
      font-family: inherit;
    }
    .action-btn:hover {
      border-color: var(--accent-primary-bright);
      color: var(--ink-deep);
      background: rgba(240, 184, 64, 0.06);
    }
    .action-btn.primary {
      background: var(--gradient-btn);
      color: var(--text-on-dark);
      border-color: transparent;
    }
    .action-btn.primary:hover {
      opacity: 0.88;
      box-shadow: 0 2px 8px rgba(205, 157, 56, 0.3);
    }
    .action-btn.danger {
      border-color: rgba(200, 106, 130, 0.3);
      color: var(--accent-berry);
    }
    .action-btn.danger:hover {
      background: rgba(200, 106, 130, 0.08);
      border-color: var(--accent-berry);
    }
    .action-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      pointer-events: none;
    }
    .action-btn i { width: 12px; height: 12px; }

    /* ── Inline insight ── */
    .insight-inline {
      font-size: 0.82rem;
      color: var(--text-main);
      padding: 10px 14px;
      margin: 6px 14px 6px 14px;
      background: rgba(240, 184, 64, 0.05);
      border-left: 2px solid var(--accent-primary-bright);
      border-radius: 0 8px 8px 0;
      line-height: 1.5;
    }
    .insight-inline .insight-label {
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--accent-primary-bright);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 3px;
    }
    .insight-inline .insight-score {
      display: inline-block;
      margin-left: 8px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .insight-spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid var(--border);
      border-top-color: var(--accent-primary-bright);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .at-summary {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .attention-card .at-actions {
      flex-shrink: 0;
      display: flex;
      align-items: center;
    }
    .attention-card {
      flex-wrap: wrap;
    }
    .attention-card .chip.state {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(240, 184, 64, 0.1);
      color: var(--accent-primary-bright);
      border: 1px solid rgba(240, 184, 64, 0.2);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .attention-card .chip.state.queued {
      background: rgba(107, 181, 201, 0.1);
      color: var(--accent-cool);
      border-color: rgba(107, 181, 201, 0.2);
    }

    /* ── Batch bar ── */
    .batch-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 18px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 14px 10px 14px 10px;
      margin-bottom: 10px;
    }
    .batch-bar .batch-label {
      flex: 1;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .batch-bar .action-btn i { width: 14px; height: 14px; }
  </style>
</head>
<body>
  <div class="app-container">
    <nav class="sidebar-nav">
      <div class="brand">
        <div class="brand-title">Video DL</div>
        <div class="brand-version" data-app-version>v1.0.31</div>
      </div>
      <div class="nav-menu">
        <a href="/" class="nav-item"><i data-feather="download"></i> Downloader</a>
        <a href="/channels.html" class="nav-item"><i data-feather="list"></i> Inbox</a>
        <a href="/analysis.html" class="nav-item active"><i data-feather="sparkles"></i> Analysis</a>
        <a href="/library.html" class="nav-item"><i data-feather="hard-drive"></i> Library</a>
      </div>
    </nav>

    <main class="main-content">
      <div class="content-wrapper">
        <header class="page-header">
          <h1>Analysis Dashboard</h1>
          <p class="sub">了解你的内容消费模式，发现值得关注的方向。</p>
        </header>

        <div id="dashboard-root">
          <div class="dash-empty" id="loading-state">
            <i data-feather="loader"></i>
            加载中...
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>feather.replace();</script>
  <script>
    // ── State ──
    const root = document.getElementById("dashboard-root");
    let dashboardData = null;

    // ── Boot ──
    loadDashboard();

    // ── API ──
    async function loadDashboard() {
      try {
        const data = await api("/api/analysis/dashboard");
        dashboardData = data;
        render(data);
      } catch (err) {
        root.innerHTML = `<div class="dash-empty" style="color:var(--error)"><i data-feather="alert-circle"></i>${esc(err.message)}</div>`;
        feather.replace();
      }
    }

    async function reloadDashboard() {
      try {
        const data = await api("/api/analysis/dashboard");
        dashboardData = data;
        render(data);
      } catch (err) {
        setActionStatus("Failed to reload: " + err.message);
      }
    }

    // ── Render ──
    function render(data) {
      const parts = [];

      parts.push(renderStats(data.overview));
      parts.push(renderChannelSection(data.channelStats));
      parts.push(renderAttentionSection(data.needsAttention));
      parts.push(renderUnprocessedSection(data.unprocessedItems));
      parts.push(renderActivitySection(data.recentActivity));
      parts.push(renderAiSection(data));

      root.innerHTML = parts.join("");
      feather.replace();
      applyRelativeTimes();
    }

    // ── Stat cards ──
    function renderStats(o) {
      const cards = [
        { value: o.totalTracked, label: "已追踪", sub: "总记录数" },
        { value: o.totalDownloaded, label: "已下载", sub: `${o.downloadRate}% 下载率` },
        { value: `${o.completionRate}%`, label: "完成率", sub: `${o.totalCompleted} 条已完成` },
        { value: o.totalSkipped, label: "已跳过", sub: `${o.totalTracked ? Math.round(o.totalSkipped / o.totalTracked * 100) : 0}% 跳过率` },
        { value: o.unprocessed, label: "待处理", sub: o.unprocessed === 0 ? "全部已处理" : "尚未采取行动", cls: o.unprocessed > 5 ? "overdue" : "" },
        { value: o.aiAnalyzed, label: "AI 分析", sub: o.aiAnalyzed === 0 ? "尚未使用" : "已获得 AI 判断" }
      ];

      return `<div class="stats-grid stagger-group">${cards.map(c =>
        `<div class="stat-card scale-in"><div class="stat-value ${c.cls || ""}">${c.value}</div><div class="stat-label">${c.label}</div><div class="stat-sub">${c.sub}</div></div>`
      ).join("")}</div>`;
    }

    // ── Channel section ──
    function renderChannelSection(channels) {
      if (!channels || channels.length === 0) {
        return emptySection("grid", "暂无频道数据。在 Inbox 中添加频道后，这里会显示各频道的消费表现。");
      }

      const rows = channels.map(ch => {
        const rate = ch.downloadRate;
        const barClass = rate < 25 ? "low" : rate < 60 ? "mid" : "";
        return `<tr>
          <td class="ch-name" title="${esc(ch.name)}">${esc(ch.name)}</td>
          <td class="ch-count">${ch.totalItems}</td>
          <td class="ch-count">${ch.downloaded}</td>
          <td class="ch-count">${ch.skipped}</td>
          <td class="ch-rate">
            <span class="bar-track"><span class="bar-fill ${barClass}" style="width:${rate}%"></span></span>
            <span>${rate}%</span>
          </td>
        </tr>`;
      }).join("");

      return section("trending-up", "频道表现",
        `<div class="glass-panel" style="padding:0;overflow-x:auto;"><table class="ch-table">
          <thead><tr><th>频道</th><th style="text-align:center">追踪</th><th style="text-align:center">已下载</th><th style="text-align:center">已跳过</th><th style="text-align:right">下载率</th></tr></thead>
          <tbody>${rows}</tbody>
        </table></div>`
      );
    }

    // ── Needs attention ──
    function renderAttentionSection(items) {
      if (!items || items.length === 0) {
        return emptySection("inbox", "没有需要关注的内容。所有项目都已处理或有待你主动查看。");
      }

      const cards = items.map(item => {
        const statusLabel = item.status === "review_later" ? "稍后再看" : "排队中";
        const statusClass = item.status === "queued" ? "queued" : "";
        const key = item.key || item.id || "";
        const titleTag = item.garbled
          ? `<span class="garbled-title">${esc(item.title)}</span>${garbledBadge()}`
          : `<span>${esc(item.title)}</span>`;
        const channelTag = item.channelName ? `<span class="at-channel">${esc(item.channelName)}</span>` : "";
        const insightHtml = item.hasAiInsight
          ? `<div class="insight-inline"><div class="insight-label">AI 分析</div>已有 AI 分析结果</div>`
          : "";

        return `<div class="attention-card stagger-item" data-key="${esc(key)}">
          <span class="chip state ${statusClass}">${statusLabel}</span>
          <div class="at-summary">
            <div style="display:flex;align-items:center;gap:8px;min-width:0">
              ${titleTag}
              ${channelTag}
            </div>
            ${insightHtml}
          </div>
          <div class="at-actions action-group">
            <button class="action-btn primary" data-action="ai" data-key="${esc(key)}" data-url="${esc(item.url)}" data-channel="${esc(item.channelName)}"><i data-feather="zap"></i> AI</button>
            <button class="action-btn" data-action="done" data-key="${esc(key)}"><i data-feather="check"></i> 完成</button>
            <button class="action-btn danger" data-action="skip" data-key="${esc(key)}"><i data-feather="x"></i> 跳过</button>
          </div>
        </div>`;
      }).join("");

      return section("inbox", "待关注", `<div class="stagger-group">${cards}</div>`,
        `<span class="badge">${items.length} 项</span>`
      );
    }

    // ── Unprocessed items ──
    function renderUnprocessedSection(items) {
      if (!items || items.length === 0) {
        return emptySection("layers", "没有待处理的内容。所有视频都已评估或处理。");
      }

      const cards = items.map(item => {
        const key = item.key || item.id || "";
        const titleTag = item.garbled
          ? `<span class="garbled-title">${esc(item.title)}</span>${garbledBadge()}`
          : `<span>${esc(item.title)}</span>`;
        const channelTag = item.channelName ? `<span class="at-channel">${esc(item.channelName)}</span>` : "";

        let meta = "";
        if (item.duration) meta += `${fmtDuration(item.duration)} · `;
        meta += "尚未处理";

        return `<div class="attention-card stagger-item" data-key="${esc(key)}">
          <span class="chip state" style="background:rgba(200,106,130,0.08);color:var(--accent-berry);border-color:rgba(200,106,130,0.15)">待评估</span>
          <div class="at-summary">
            <div style="display:flex;align-items:center;gap:8px;min-width:0">
              ${titleTag}
              ${channelTag}
            </div>
            <div class="meta-muted">${meta}</div>
          </div>
          <div class="at-actions action-group">
            <button class="action-btn primary" data-action="ai" data-key="${esc(key)}" data-url="${esc(item.url)}" data-channel="${esc(item.channelName)}"><i data-feather="zap"></i> AI</button>
            <button class="action-btn" data-action="done" data-key="${esc(key)}"><i data-feather="check"></i> 完成</button>
            <button class="action-btn danger" data-action="skip" data-key="${esc(key)}"><i data-feather="x"></i> 跳过</button>
          </div>
        </div>`;
      }).join("");

      const batchBar = `<div class="batch-bar">
        <span class="batch-label">${items.length} 个视频尚未评估</span>
        <button class="action-btn primary batch-ai-btn" data-action="batch-ai"><i data-feather="zap"></i> AI 批量分析</button>
      </div>`;

      return section("layers", "待评估视频",
        batchBar + `<div class="stagger-group">${cards}</div>`,
        `<span class="badge">${items.length} 项</span>`
      );
    }

    // ── Activity ──
    function renderActivitySection(activities) {
      if (!activities || activities.length === 0) {
        return emptySection("clock", "还没有活动记录。下载、跳过或完成内容后，活动会出现在这里。");
      }

      const actionLabel = { downloaded: "下载了", skipped: "跳过了", completed: "完成了" };
      const items = activities.map(a => {
        const titleHtml = a.garbled
          ? `<span class="garbled-title">${esc(a.title)}</span> ${garbledBadge()}`
          : `<span class="act-title">${esc(a.title)}</span>`;
        return `<div class="activity-item">
          <span class="act-dot ${a.action}"></span>
          ${titleHtml}
          <span class="act-channel">${esc(a.channelName || "")}</span>
          <span class="act-time" data-timestamp="${a.timestamp}">${fmtStamp(a.timestamp)}</span>
        </div>`;
      }).join("");

      return section("clock", "近期活动",
        `<div class="glass-panel" style="padding:0;"><div class="stagger-group">${items}</div></div>`,
        `<span class="badge">${activities.length} 条</span>`
      );
    }

    // ── AI section ──
    function renderAiSection(data) {
      const configured = data.aiConfigured;
      const icon = configured ? "on" : "off";
      const iconName = configured ? "check-circle" : "x-circle";

      let status, detail;
      if (configured) {
        status = `AI 分析已配置 · ${data.aiAnalyzed} 条已分析`;
        detail = `模型：${esc(data.aiModel)}`;
      } else {
        status = "AI 分析未配置";
        detail = "在 .env.local 中设置 DEEPSEEK_API_KEY 以启用 AI 辅助判断。";
      }

      return section("cpu", "AI 分析概览",
        `<div class="ai-card">
          <div class="ai-icon ${icon}"><i data-feather="${iconName}" style="width:20px;height:20px"></i></div>
          <div class="ai-body">
            <div class="ai-status">${status}</div>
            <div class="ai-detail">${detail}</div>
          </div>
        </div>`
      );
    }

    // ── Event delegation for actions ──
    root.addEventListener("click", async (e) => {
      const btn = e.target.closest("[data-action]");
      if (!btn) return;
      const action = btn.getAttribute("data-action");
      if (btn.disabled) return;

      if (action === "batch-ai") {
        await handleBatchAi();
        return;
      }

      const key = btn.getAttribute("data-key");
      if (!key) return;

      btn.disabled = true;

      if (action === "done") {
        await handleAction(key, "completed", btn);
      } else if (action === "skip") {
        await handleAction(key, "skipped", btn);
      } else if (action === "ai") {
        const url = btn.getAttribute("data-url");
        const channel = btn.getAttribute("data-channel");
        await handleAi(key, url || "", channel || "", btn);
      }
    });

    async function handleAction(key, status, btn) {
      try {
        await api("/api/content/state", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: key.replace(/^yt:/, ""), status })
        });
        removeItemCard(key);
        setActionStatus(status === "completed" ? "✓ 标记为已完成" : "✓ 已跳过");
      } catch (err) {
        btn.disabled = false;
        setActionStatus("✗ " + err.message);
      }
    }

    async function handleAi(key, url, channelName, btn) {
      const card = btn.closest(".attention-card");
      if (card && !card.querySelector(".insight-inline")) {
        const spinner = document.createElement("div");
        spinner.className = "insight-inline";
        spinner.id = "insight-" + key;
        spinner.innerHTML = '<span class="insight-spinner"></span> AI 分析中...';
        const summary = card.querySelector(".at-summary");
        if (summary) summary.appendChild(spinner);
      }

      try {
        const data = await api("/api/content/ai-insight", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            id: key.replace(/^yt:/, ""),
            title: "",
            url,
            channelName
          })
        });
        const insight = data.aiInsight;
        const html = `<div class="insight-inline">
          <div class="insight-label">AI 分析 <span class="insight-score">${insight.recommendation} · ${insight.score}/100</span></div>
          ${esc(insight.summary)}
        </div>`;
        const existing = document.getElementById("insight-" + key);
        if (existing) {
          existing.outerHTML = html;
        } else {
          const card = btn.closest(".attention-card");
          const summary = card && card.querySelector(".at-summary");
          if (summary) summary.insertAdjacentHTML("beforeend", html);
        }
        setActionStatus("✓ AI 分析完成");
        btn.disabled = false;
      } catch (err) {
        btn.disabled = false;
        const existing = document.getElementById("insight-" + key);
        if (existing) existing.remove();
        setActionStatus("✗ AI 分析失败: " + err.message);
      }
    }

    async function handleBatchAi() {
      const items = dashboardData ? dashboardData.unprocessedItems || [] : [];
      if (!items.length) return;

      let done = 0;
      let failed = 0;
      const batchBtn = root.querySelector(".batch-ai-btn");
      if (batchBtn) {
        batchBtn.disabled = true;
        batchBtn.innerHTML = '<span class="insight-spinner"></span> 分析中...';
      }

      const toProcess = items.filter(item => (item.key || item.id));
      for (const item of toProcess) {
        try {
          await api("/api/content/ai-insight", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              id: (item.key || item.id).replace(/^yt:/, ""),
              title: "",
              url: item.url || "",
              channelName: item.channelName || ""
            })
          });
          done++;
        } catch {
          failed++;
        }
      }

      if (batchBtn) {
        batchBtn.disabled = false;
        batchBtn.innerHTML = '<i data-feather="zap"></i> AI 批量分析';
        feather.replace();
      }

      setActionStatus(`✓ AI 批量分析完成: ${done} 成功, ${failed} 失败`);
      reloadDashboard();
    }

    function removeItemCard(key) {
      const card = root.querySelector(`.attention-card[data-key="${esc(key)}"]`);
      if (card) {
        card.style.transition = "all 0.25s ease";
        card.style.opacity = "0";
        card.style.transform = "translateX(-20px)";
        setTimeout(() => {
          card.remove();
          updateSectionBadges();
          updateStatCards();
        }, 260);
      }
    }

    // ── Status indicator ──
    let statusEl = null;

    function setActionStatus(msg) {
      if (!statusEl) {
        statusEl = document.createElement("div");
        statusEl.style.cssText = "position:fixed;bottom:24px;right:24px;z-index:999;padding:10px 18px;border-radius:12px;background:var(--bg-surface);border:1px solid var(--border);box-shadow:var(--shadow-elevated);font-size:0.85rem;color:var(--text-main);transition:opacity 0.3s ease;max-width:400px;";
        document.body.appendChild(statusEl);
      }
      statusEl.textContent = msg;
      statusEl.style.opacity = "1";
      clearTimeout(statusEl._hide);
      statusEl._hide = setTimeout(() => { statusEl.style.opacity = "0"; }, 3000);
    }

    function updateSectionBadges() {
      document.querySelectorAll(".dash-section").forEach(section => {
        const visible = section.querySelectorAll(".attention-card:not([style*='opacity: 0'])").length;
        const badge = section.querySelector(".badge");
        if (badge) badge.textContent = visible + " 项";
      });
    }

    function updateStatCards() {
      // Reload fresh data from server
      reloadDashboard();
    }

    // ── Helpers ──
    function section(icon, title, body, badge = "") {
      return `<section class="dash-section">
        <div class="dash-section-header">
          <i data-feather="${icon}" style="width:18px;height:18px"></i>
          <h2>${title}</h2>
          ${badge}
        </div>
        ${body}
      </section>`;
    }

    function emptySection(icon, message) {
      return section(icon, "暂无数据",
        `<div class="glass-panel"><div class="dash-empty"><i data-feather="${icon}" style="width:28px;height:28px"></i>${message}</div></div>`
      );
    }

    function applyRelativeTimes() {
      document.querySelectorAll("[data-timestamp]").forEach(el => {
        const ts = el.getAttribute("data-timestamp");
        if (ts) el.textContent = relativeTime(ts);
      });
    }

    function relativeTime(iso) {
      if (!iso) return "";
      const ms = Date.now() - new Date(iso).getTime();
      if (ms < 0) return "刚刚";
      const mins = Math.floor(ms / 60000);
      if (mins < 1) return "刚刚";
      if (mins < 60) return `${mins} 分钟前`;
      const hours = Math.floor(mins / 60);
      if (hours < 24) return `${hours} 小时前`;
      const days = Math.floor(hours / 24);
      if (days < 30) return `${days} 天前`;
      return new Date(iso).toLocaleDateString("zh-CN");
    }

    function fmtStamp(value) {
      if (!value) return "";
      try {
        return new Date(value).toLocaleString("zh-CN", { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
      } catch { return ""; }
    }

    function fmtDuration(secs) {
      const n = Number(secs) || 0;
      if (n < 60) return n + "秒";
      if (n < 3600) return Math.floor(n / 60) + "分钟";
      return Math.floor(n / 3600) + "小时 " + Math.floor((n % 3600) / 60) + "分";
    }

    function esc(value) {
      return String(value == null ? "" : value)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    function garbledBadge() {
      return '<span class="garbled-badge"><i data-feather="alert-triangle" style="width:10px;height:10px"></i> 标题异常</span>';
    }

    async function api(url, options = {}) {
      const r = await fetch(url, options);
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || "Request failed.");
      return d;
    }
  </script>
</body>
</html>
